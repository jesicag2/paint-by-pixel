# paint by pixel settings
# script settings, for models

model:
  base_model: "stable-diffusion-v1-5/stable-diffusion-v1-5"   # hugging face model
  lora_path: null          

generation:
  height: 512              
  width: 512
  num_inference_steps: 30  
  guidance_scale: 7.5      
  scheduler: "dpmpp"      
  prompt_template: "{prompt}, pixel art sprite, single object, centered, plain white background"
  negative_prompt: "blurry, photo, realistic, 3d render, text, watermark, multiple objects, gradient background, shadow"
  seeds: [0, 1, 2, 3]   

eval:
  prompts_file: "eval/prompts.csv"
  out_dir: "outputs/eval"  
